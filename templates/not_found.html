<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — {{ site_title }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ css_href }}" />
  <script>
    (function () {
      const saved = localStorage.getItem("theme");
      const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.setAttribute("data-theme", saved || (prefersDark ? "dark" : "light"));
    })();
  </script>
</head>
<body>
  <div class="shell">
    <aside class="nav-wrap">
      <nav class="nav" aria-label="Main navigation">
        <div class="nav-links">
          {% for item in top_nav %}
            <a href="{{ item.href }}" class="nav-link">{{ item.label }}</a>
          {% endfor %}
        </div>
      </nav>
    </aside>

    <main>
      <section>
        <h1 class="page-title">404 - Page Not Found</h1>
        <p class="not-found-text">The page you are looking for does not exist.</p>
      </section>
    </main>

    <footer class="footer">
      <p class="copyright">© 2026 Apoorva Sahay</p>
    </footer>
  </div>
</body>
</html>
